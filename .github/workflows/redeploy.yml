name: Redeploy

on:
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 -X POST "${{ secrets.DEPLOY_HOOK_URL }}")
          echo "Deploy hook HTTP $code"
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then exit 1; fi
