name: Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render
        run: |
          code=$(curl --silent --show-error --location \
            --retry 5 --retry-delay 20 --retry-all-errors \
            --max-time 120 --output /dev/null \
            --write-out "%{http_code}" \
            https://tg1-schedule-bot.onrender.com/health)
          echo "Health status: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Bot did not wake up after retries (HTTP $code)"
            exit 1
          fi
